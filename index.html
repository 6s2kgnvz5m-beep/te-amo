<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julia, você aceita?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;700&display=swap');

  :root{
    --red-deep: #B3181F;
    --red-main: #E23744;
    --red-bright: #FF4D57;
    --cream: #FFF6EC;
    --white: #FFFFFF;
    --gold: #F4C34E;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family: 'Quicksand', sans-serif;
    background: radial-gradient(circle at 50% 15%, var(--red-bright) 0%, var(--red-main) 45%, var(--red-deep) 100%);
  }

  .bg-deco{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }
  .bow{
    position:absolute;
    opacity:0.16;
    animation: float 9s ease-in-out infinite;
  }
  .bow svg{ width:100%; height:100%; display:block; }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-24px) rotate(6deg); }
  }

  .stage{
    position:relative;
    z-index:2;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }

  .card{
    background: var(--cream);
    border-radius: 32px;
    padding: 44px 34px 38px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(90,0,5,0.45), inset 0 0 0 6px var(--white);
    position: relative;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-22px; left:50%;
    transform:translateX(-50%);
    width:56px; height:34px;
    background: var(--red-main);
    clip-path: polygon(50% 30%, 100% 0, 78% 100%, 50% 55%, 22% 100%, 0 0);
  }

  .ears{
    width: 92px;
    margin: -10px auto 6px;
  }

  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 34px);
    color: var(--red-deep);
    margin: 6px 0 2px;
    line-height: 1.15;
  }

  .subtitle{
    font-size: 15.5px;
    color:#8a3a3a;
    margin: 0 0 26px;
    font-weight: 600;
  }

  .buttons{
    position: relative;
    display:flex;
    gap:16px;
    justify-content:center;
    align-items:center;
    min-height: 64px;
  }

  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 18px;
    border:none;
    border-radius: 999px;
    padding: 15px 30px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  #yes{
    background: linear-gradient(180deg, var(--red-bright), var(--red-main));
    color: var(--white);
    box-shadow: 0 10px 22px rgba(178,20,25,0.45);
  }
  #yes:hover{ transform: scale(1.06); }
  #yes:active{ transform: scale(0.97); }

  #no{
    background: var(--white);
    color: var(--red-main);
    box-shadow: 0 6px 16px rgba(178,20,25,0.18);
    position: relative;
  }

  .hint{
    margin-top: 18px;
    font-size: 13px;
    color:#b06a6a;
    font-weight:600;
    min-height: 18px;
  }

  .final{
    display:none;
    flex-direction:column;
    align-items:center;
    gap: 10px;
  }
  .final.show{ display:flex; }
  .stage .card.hidden{ display:none; }

  .final-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(30px, 8vw, 44px);
    color: var(--white);
    text-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .final-sub{
    color:#ffe3e3;
    font-weight:600;
    font-size:16px;
  }
  .hearts{
    font-size: 40px;
    margin-top: 6px;
    animation: pop .6s ease;
  }
  @keyframes pop{
    0%{ transform: scale(0); opacity:0; }
    60%{ transform: scale(1.2); opacity:1; }
    100%{ transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .bow{ animation: none; }
    .hearts{ animation: none; }
  }
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<div class="stage">
  <div class="card" id="card">
    <div class="ears">
      <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="18" r="16" fill="#ffffff" stroke="#B3181F" stroke-width="3"/>
        <circle cx="80" cy="18" r="16" fill="#ffffff" stroke="#B3181F" stroke-width="3"/>
        <ellipse cx="50" cy="34" rx="36" ry="24" fill="#ffffff" stroke="#B3181F" stroke-width="3"/>
        <polygon points="30,20 40,12 42,24" fill="#E23744"/>
      </svg>
    </div>

    <p class="title">Julia, quer namorar comigo? ❤️</p>
    <p class="subtitle">é só apertar o botão certo, viu 😽</p>

    <div class="buttons" id="buttons">
      <button id="yes">Siiim! 🤍</button>
      <button id="no">Não</button>
    </div>

    <p class="hint" id="hint">&nbsp;</p>
  </div>

  <div class="final" id="final">
    <div class="hearts">🥰</div>
    <p class="final-title">EU TE AMO!!</p>
    <p class="final-sub">Eu te amo muito princesa obrigado por estar sempre ao meu lado😍</p>
  </div>
</div>

<script>
  const bgDeco = document.getElementById('bgDeco');
  const positions = [
    {top:'8%', left:'10%', size:60, delay:'0s'},
    {top:'70%', left:'6%', size:44, delay:'1.5s'},
    {top:'15%', left:'85%', size:50, delay:'0.7s'},
    {top:'75%', left:'88%', size:64, delay:'2.2s'},
    {top:'45%', left:'2%', size:36, delay:'1s'},
    {top:'50%', left:'93%', size:40, delay:'2.8s'},
  ];
  positions.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'bow';
    div.style.top = p.top;
    div.style.left = p.left;
    div.style.width = p.size+'px';
    div.style.height = (p.size*0.6)+'px';
    div.style.animationDelay = p.delay;
    div.innerHTML = `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,30 0,0 8,30 0,60" fill="#ffffff"/>
      <polygon points="50,30 100,0 92,30 100,60" fill="#ffffff"/>
      <circle cx="50" cy="30" r="12" fill="#ffffff"/>
    </svg>`;
    bgDeco.appendChild(div);
  });

  const yesBtn = document.getElementById('yes');
  const noBtn = document.getElementById('no');
  const buttons = document.getElementById('buttons');
  const hint = document.getElementById('hint');
  const card = document.getElementById('card');
  const final = document.getElementById('final');

  const hints = [
    "ei, tenta de novo 👀",
    "essa não vale hihi",
    "só tem uma resposta certa aqui ❤️",
    "vai, aperta o outro ❣️",
    "quase! só que não 😹"
  ];
  let hintIndex = 0;
  let dodgeCount = 0;

  function moveNoButton(){
    const rect = buttons.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    const maxX = rect.width - btnRect.width;
    const maxY = 120;

    const newX = Math.random() * maxX - (maxX/2);
    const newY = Math.random() * maxY - (maxY/2);

    noBtn.style.position = 'relative';
    noBtn.style.transform = `translate(${newX}px, ${newY}px)`;

    hint.textContent = hints[hintIndex % hints.length];
    hintIndex++;
    dodgeCount++;

    if (dodgeCount > 6){
      noBtn.style.transform += ' scale(0.85)';
    }
  }

  noBtn.addEventListener('mouseenter', moveNoButton);
  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    moveNoButton();
  }, {passive:false});
  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    moveNoButton();
  });

  yesBtn.addEventListener('click', function(){
    card.classList.add('hidden');
    final.classList.add('show');
  });
</script>

</body>
</html>
